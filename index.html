<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- 1) META & TITLE -->
    <meta charset="UTF-8" />
    <title>Cult of Dirty RPG Presents: Picture Perfect</title>

    <!-- 2) STYLES: GLOBAL LAYOUT, DARK BASE, THEMES -->
    <style>
      /* 2.1 DARK BASE BACKGROUND + FONT */
      html {
        width: 100%;
        height: 100%;
        overflow: auto;
        font-family: Verdana, sans-serif;
        font-size: 10px;
        background: radial-gradient(
          circle at top,
          #141827 0,
          #05060a 65%,
          #020308 100%
        );
      }

      /* 2.2 THEME VARIABLES BY BODY CLASS */
      /* GOLD EMBER (default) */
      body.theme-gold {
        --accent-main: #ffbf3c;
        --accent-secondary: #f06c1c;
        --accent-soft: #ffe9b5;

        --panel-bg: rgba(6, 7, 14, 0.96);
        --panel-border: rgba(255, 255, 255, 0.06);

        --accent-glow: rgba(250, 190, 80, 0.35);

        --input-bg: rgba(10, 12, 20, 0.95);
        --icon-bg: rgba(10, 12, 20, 0.96);

        --text-main: #f5f5f5;
        --text-muted: rgba(245, 245, 245, 0.75);
      }

      /* NECRO GREEN */
      body.theme-necro {
        --accent-main: #38ff88;
        --accent-secondary: #14c76b;
        --accent-soft: #c8ffde;

        --panel-bg: rgba(3, 12, 10, 0.96);
        --panel-border: rgba(125, 255, 190, 0.16);

        --accent-glow: rgba(90, 255, 170, 0.4);

        --input-bg: rgba(3, 18, 14, 0.96);
        --icon-bg: rgba(5, 25, 20, 0.96);

        --text-main: #e8fff5;
        --text-muted: rgba(220, 255, 240, 0.8);
      }

      /* ELDRITCH VIOLET */
      body.theme-eldritch {
        --accent-main: #c273ff;
        --accent-secondary: #7b3dff;
        --accent-soft: #e2c7ff;

        --panel-bg: rgba(10, 6, 24, 0.96);
        --panel-border: rgba(210, 160, 255, 0.16);

        --accent-glow: rgba(194, 115, 255, 0.45);

        --input-bg: rgba(15, 10, 35, 0.96);
        --icon-bg: rgba(20, 12, 40, 0.96);

        --text-main: #f4ecff;
        --text-muted: rgba(240, 225, 255, 0.8);
      }

      /* BLOOD RITE */
      body.theme-blood {
        --accent-main: #ff3b3b;
        --accent-secondary: #c21830;
        --accent-soft: #ffc4c4;

        --panel-bg: rgba(18, 5, 8, 0.96);
        --panel-border: rgba(255, 100, 120, 0.18);

        --accent-glow: rgba(255, 70, 100, 0.45);

        --input-bg: rgba(22, 8, 12, 0.96);
        --icon-bg: rgba(26, 10, 14, 0.96);

        --text-main: #ffeef0;
        --text-muted: rgba(255, 220, 225, 0.8);
      }

      /* 2.3 BODY LAYOUT (USES ACTIVE THEME VARS) */
      body {
        flex: 1 1 auto;
        overflow: auto;
        margin: 16px;
        padding: 0;
        grid-column-gap: 24px;
        font-size: 16px;
        color: var(--text-main);
        flex-flow: row wrap;
        align-items: flex-start;
      }

      input,
      select {
        font-family: Verdana, sans-serif;
      }

      html,
      body,
      span,
      label,
      div {
        display: flex;
        position: relative;
        box-sizing: border-box;
      }

      .hidden {
        display: none;
      }

      /* 3) HEADER BRANDING */
      #app-header {
        flex: 0 0 100%;
        flex-flow: column;
        align-items: flex-start;
        margin-bottom: 18px;
        gap: 4px;
      }

      #app-header h1 {
        font-size: 22px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--accent-soft);
        text-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
      }

      #app-header h1 span {
        display: inline-flex;
        margin-left: 4px;
        font-weight: 800;
      }

      #app-header p {
        font-size: 13px;
        color: var(--text-muted);
      }

      /* 4) CONTROL PANEL CARD */
      #control {
        display: flex;
        flex: 0 0 280px;
        flex-flow: column;
        width: 280px;
        grid-row-gap: 10px;
        padding: 16px 18px 20px;
        background: var(--panel-bg);
        border-radius: 12px;
        border: 1px solid var(--panel-border);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75);
      }

      /* 5) PREVIEW AREA */
      #preview {
        display: flex;
        flex: 1 1 auto;
        flex-flow: column;
        align-items: center;
        padding: 10px 0;
      }

      #natural_dimension {
        margin-top: 8px;
        font-size: 12px;
        color: var(--text-muted);
      }

      /* 6) CANVAS LOOK */
      #canvas {
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        background: radial-gradient(
          circle at top,
          #262c3f 0,
          #0a0b16 65%,
          #05050b 100%
        );
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.9);
      }

      #canvas.active {
        cursor: pointer;
      }

      /* 7) ROW LAYOUT */
      .row {
        align-items: center;
        grid-column-gap: 10px;
      }

      /* 8) INPUT SHELLS */
      .input {
        flex: 1 0 auto;
        flex-flow: column;
        justify-content: space-between;
        height: 36px;
        background: var(--input-bg);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        padding: 2px 6px;
        cursor: text;
      }

      .input span {
        font-size: 11px;
        color: var(--text-muted);
      }

      .input input {
        background: transparent;
        outline: none;
        border: none;
        padding: 0;
        color: var(--text-main);
      }

      /* 9) FILE ICON BUTTON */
      .icon-button {
        flex: 0 0 auto;
        font-size: 24px;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: var(--icon-bg);
        cursor: pointer;
        transition: transform 0.08s ease-out, box-shadow 0.08s ease-out,
          background 0.08s ease-out;
      }

      .icon-button:hover {
        background: rgba(22, 26, 42, 1);
        box-shadow: 0 0 0 1px var(--accent-glow);
        transform: translateY(-1px);
      }

      /* 10) MAIN BUTTONS */
      .button {
        flex: 1 0 auto;
        font-size: 14px;
        height: 36px;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          var(--accent-main),
          var(--accent-secondary)
        );
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #1b1307;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
        transition: transform 0.08s ease-out, box-shadow 0.08s ease-out,
          filter 0.08s ease-out;
      }

      .button:hover:enabled {
        transform: translateY(-1px);
        box-shadow: 0 9px 26px rgba(0, 0, 0, 0.8);
        filter: brightness(1.05);
      }

      .button:disabled {
        color: rgba(255, 255, 255, 0.5);
        background: linear-gradient(135deg, #5b5b5b, #3a3a3a);
        box-shadow: none;
        cursor: default;
        filter: grayscale(0.3);
      }

      /* 11) THEME PICKER ROW */
      .theme-row {
        margin-top: 8px;
        justify-content: space-between;
        align-items: center;
      }

      .theme-label {
        font-size: 11px;
        color: var(--text-muted);
      }

      .theme-buttons {
        display: flex;
        grid-column-gap: 6px;
        justify-content: flex-end;
      }

      .theme-button {
        width: 30px;
        height: 20px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.6);
        cursor: pointer;
        padding: 0;
        outline: none;
      }

      .theme-button:focus-visible {
        outline: 2px solid var(--accent-soft);
      }

      /* Individual color previews for the buttons */
      .theme-button.gold {
        background: linear-gradient(135deg, #ffbf3c, #f06c1c);
      }

      .theme-button.necro {
        background: linear-gradient(135deg, #38ff88, #14c76b);
      }

      .theme-button.eldritch {
        background: linear-gradient(135deg, #c273ff, #7b3dff);
      }

      .theme-button.blood {
        background: linear-gradient(135deg, #ff3b3b, #c21830);
      }
    </style>
  </head>

  <!-- default theme: GOLD -->
  <body class="theme-gold">
    <!-- 12) HEADER CONTENT -->
    <header id="app-header">
      <h1>Cult of Dirty RPG Presents:<span> Picture Perfect</span></h1>
      <p>Load an image, generate the grid, then reveal it one click at a time.</p>
    </header>

    <!-- 13) CONTROL PANEL -->
    <div id="control">
      <div class="row">
        <label class="input">
          <span>URL to image</span>
          <input id="file_input" />
        </label>
        <label class="icon-button" id="file_button">
          <span style="transform: rotate(270deg)">➥</span>
          <input type="file" id="file_browse" class="hidden" />
        </label>
      </div>

      <div class="row">
        <label class="input">
          <span>Font size</span>
          <input id="font-size" type="number" min="10" max="30" />
        </label>
      </div>

      <div class="row">
        <label class="input">
          <span>Width</span>
          <input id="width" type="number" min="300" />
        </label>
      </div>

      <div class="row">
        <label class="input">
          <span>Height</span>
          <input id="height" type="number" min="300" />
        </label>
      </div>

      <div class="row">
        <label class="input">
          <span>Columns</span>
          <input id="column" type="number" min="1" />
        </label>
      </div>

      <div class="row">
        <label class="input">
          <span>Rows</span>
          <input id="row" type="number" min="1" />
        </label>
      </div>

      <div class="row">
        <button class="button" id="generate" disabled>Generate grid</button>
        <button class="button" id="start" disabled>Start</button>
        <button class="button hidden" id="stop">Stop</button>
      </div>

      <!-- 14) THEME PICKER (RIGHT-SIDE CHOICES FOR GM) -->
      <div class="row theme-row">
        <span class="theme-label">Theme</span>
        <div class="theme-buttons">
          <button
            class="theme-button gold"
            type="button"
            data-theme="gold"
            title="Gold Ember"
          ></button>
          <button
            class="theme-button necro"
            type="button"
            data-theme="necro"
            title="Necro Green"
          ></button>
          <button
            class="theme-button eldritch"
            type="button"
            data-theme="eldritch"
            title="Eldritch Violet"
          ></button>
          <button
            class="theme-button blood"
            type="button"
            data-theme="blood"
            title="Blood Rite"
          ></button>
        </div>
      </div>
    </div>

    <!-- 15) PREVIEW & CANVAS -->
    <div id="preview">
      <canvas
        id="canvas"
        width="600"
        height="600"
        style="width: 600px; height: 600px"
      ></canvas>
      <i id="natural_dimension"></i>
    </div>

    <!-- 16) SCRIPT: GAME LOGIC + THEME SWITCHING -->
    <script>
      const element_canvas = document.getElementById("canvas");
      const element_file_button = document.getElementById("file_button");
      const element_file_input = document.getElementById("file_input");
      const element_file_browse = document.getElementById("file_browse");
      const element_font_size = document.getElementById("font-size");
      const element_width = document.getElementById("width");
      const element_height = document.getElementById("height");
      const element_row = document.getElementById("row");
      const element_column = document.getElementById("column");
      const element_generate = document.getElementById("generate");
      const element_start = document.getElementById("start");
      const element_stop = document.getElementById("stop");
      const ctx = element_canvas.getContext("2d");

      const colors = [
        "#1abc9c",
        "#2ecc71",
        "#3498db",
        "#9b59b6",
        "#16a085",
        "#27ae60",
        "#2980b9",
        "#8e44ad",
        "#f1c40f",
        "#e67e22",
        "#e74c3c",
        "#30336b",
        "#f39c12",
        "#d35400",
        "#c0392b",
        "#ffbe76",
        "#f9ca24",
        "#f0932b",
        "#eb4d4b",
        "#6ab04c",
        "#7ed6df",
        "#22a6b3",
        "#e056fd",
        "#be2edd",
        "#686de0",
        "#4834d4",
        "#badc58",
        "#b33771",
        "#6d214f",
        "#9aecdb",
        "#bdc581",
        "#fc427b",
      ];

      let source = "";
      let running = false;
      let font_size = 16;
      let width = 600;
      let height = 600;
      let natural_width = 0;
      let natural_height = 0;
      let quadrilateral_column = 4;
      let quadrilateral_row = 4;
      let quadrilateral_list = [];
      let quadrilateral_picked = [];

      window.onload = () => {
        element_file_input.value = source;
        element_font_size.value = font_size;
        element_width.value = width;
        element_height.value = height;
        element_row.value = quadrilateral_column + 1;
        element_column.value = quadrilateral_row + 1;

        element_canvas.addEventListener("click", handleCanvasClick);
        element_file_input.addEventListener("change", handleFileInputChange);
        element_file_browse.addEventListener("change", handleFileBrowseChange);

        element_font_size.addEventListener("change", handleFontSizeChange);
        element_width.addEventListener("change", handleSizeChange);
        element_height.addEventListener("change", handleSizeChange);

        element_row.addEventListener("change", handleGridChange);
        element_column.addEventListener("change", handleGridChange);

        element_generate.addEventListener("click", handleGenerate);
        element_start.addEventListener("click", handleStart);
        element_stop.addEventListener("click", handleStop);

        window.addEventListener("keydown", handleKeyDown);

        /* THEME BUTTON LISTENERS */
        const themeButtons = document.querySelectorAll("[data-theme]");
        themeButtons.forEach((btn) => {
          btn.addEventListener("click", () => setTheme(btn.dataset.theme));
        });

        updateCanvasSize();
      };

      function setTheme(theme) {
        const themes = ["gold", "necro", "eldritch", "blood"];
        const body = document.body;
        themes.forEach((t) => body.classList.remove("theme-" + t));
        body.classList.add("theme-" + theme);
      }

      function handleKeyDown(event) {
        let code = event.code;
        if (
          event.code !== "ControlLeft" &&
          event.code !== "ControlRight" &&
          event.ctrlKey
        )
          code = "CTRL+" + code;
        if (
          event.code !== "ShiftLeft" &&
          event.code !== "ShiftRight" &&
          event.shiftKey
        )
          code = "SHIFT+" + code;
        if (event.code !== "AltLeft" && event.code !== "AltRight" && event.altKey)
          code = "ALT+" + code;

        if (code === "CTRL+KeyC" && source) {
          event.preventDefault();
          element_canvas.toBlob((blob) =>
            navigator.clipboard.write([
              new ClipboardItem({ "image/png": blob }),
            ])
          );
        }
        if (code === "CTRL+KeyZ") {
          const index = quadrilateral_picked.pop();
          const quad = quadrilateral_list.at(index);
          if (quad !== undefined) {
            quad.checked = false;
            drawQuadrilateralGrid();
          }
        }
      }

      async function handleCanvasClick(event) {
        if (!running) return;
        const rect = event.target.getBoundingClientRect();
        const x = event.pageX - rect.x - event.target.clientLeft;
        const y = event.pageY - rect.y - event.target.clientTop;
        if (
          x < 0 ||
          y < 0 ||
          x > event.target.scrollWidth ||
          y > event.target.scrollHeight
        )
          return;

        for (let i = 0; i < quadrilateral_list.length; i++) {
          const quadrilateral = quadrilateral_list.at(i);
          if (
            !quadrilateral ||
            quad
