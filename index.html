<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cult of Dirty RPG Presents: Picture Perfect</title>

<style>
/* ============================================================
   1) GLOBAL VARIABLE DEFAULTS (overridden by theme classes)
   ============================================================ */
:root {
  --bg-top: #141827;
  --bg-mid: #05060a;
  --bg-bottom: #020308;

  --canvas-top: #262c3f;
  --canvas-mid: #0a0b16;
  --canvas-bottom: #05050b;
}

/* ============================================================
   2) BASE LAYOUT
   ============================================================ */
html {
  width: 100%;
  height: 100%;
  overflow: auto;
  font-family: Verdana, sans-serif;
  font-size: 10px;
}

body {
  flex: 1 1 auto;
  overflow: auto;
  margin: 16px;
  padding: 0;
  grid-column-gap: 24px;
  font-size: 16px;
  flex-flow: row wrap;
  align-items: flex-start;
  color: var(--text-main);

  background: radial-gradient(
    circle at top,
    var(--bg-top) 0,
    var(--bg-mid) 65%,
    var(--bg-bottom) 100%
  );
}

input, select {
  font-family: Verdana, sans-serif;
}

html, body, span, label, div {
  display: flex;
  position: relative;
  box-sizing: border-box;
}

.hidden { display: none; }

/* ============================================================
   3) THEMES
   ============================================================ */

/* GOLD EMBER — default */
body.theme-gold {
  --accent-main: #ffbf3c;
  --accent-secondary: #f06c1c;
  --accent-soft: #ffe9b5;

  --panel-bg: rgba(6,7,14,0.96);
  --panel-border: rgba(255,255,255,0.06);

  --accent-glow: rgba(250,190,80,0.35);

  --input-bg: rgba(10,12,20,0.95);
  --icon-bg: rgba(10,12,20,0.96);

  --text-main: #f5f5f5;
  --text-muted: rgba(245,245,245,0.75);

  --bg-top: #141827;
  --bg-mid: #05060a;
  --bg-bottom: #020308;

  --canvas-top: #262c3f;
  --canvas-mid: #0a0b16;
  --canvas-bottom: #05050b;
}

/* NECRO GREEN */
body.theme-necro {
  --accent-main: #38ff88;
  --accent-secondary: #14c76b;
  --accent-soft: #c8ffde;

  --panel-bg: rgba(3,12,10,0.96);
  --panel-border: rgba(125,255,190,0.16);

  --accent-glow: rgba(90,255,170,0.4);

  --input-bg: rgba(3,18,14,0.96);
  --icon-bg: rgba(5,25,20,0.96);

  --text-main: #e8fff5;
  --text-muted: rgba(220,255,240,0.8);

  --bg-top: #04241b;
  --bg-mid: #020e0a;
  --bg-bottom: #010705;

  --canvas-top: #104531;
  --canvas-mid: #052018;
  --canvas-bottom: #020c09;
}

/* ELDRITCH VIOLET */
body.theme-eldritch {
  --accent-main: #c273ff;
  --accent-secondary: #7b3dff;
  --accent-soft: #e2c7ff;

  --panel-bg: rgba(10,6,24,0.96);
  --panel-border: rgba(210,160,255,0.16);

  --accent-glow: rgba(194,115,255,0.45);

  --input-bg: rgba(15,10,35,0.96);
  --icon-bg: rgba(20,12,40,0.96);

  --text-main: #f4ecff;
  --text-muted: rgba(240,225,255,0.8);

  --bg-top: #1b0d2d;
  --bg-mid: #0a0417;
  --bg-bottom: #04010c;

  --canvas-top: #3a2960;
  --canvas-mid: #1b1238;
  --canvas-bottom: #090415;
}

/* BLOOD RITE */
body.theme-blood {
  --accent-main: #ff3b3b;
  --accent-secondary: #c21830;
  --accent-soft: #ffc4c4;

  --panel-bg: rgba(18,5,8,0.96);
  --panel-border: rgba(255,100,120,0.18);

  --accent-glow: rgba(255,70,100,0.45);

  --input-bg: rgba(22,8,12,0.96);
  --icon-bg: rgba(26,10,14,0.96);

  --text-main: #ffeef0;
  --text-muted: rgba(255,220,225,0.8);

  --bg-top: #2a050a;
  --bg-mid: #140206;
  --bg-bottom: #080104;

  --canvas-top: #4a141b;
  --canvas-mid: #26080d;
  --canvas-bottom: #120306;
}

/* ============================================================
   4) HEADER
   ============================================================ */
#app-header {
  flex: 0 0 100%;
  flex-flow: column;
  align-items: flex-start;
  margin-bottom: 18px;
  gap: 4px;
}
#app-header h1 {
  font-size: 22px;
  letter-spacing: .03em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--accent-soft);
  text-shadow: 0 0 12px rgba(0,0,0,0.9);
}
#app-header p {
  font-size: 13px;
  color: var(--text-muted);
}

/* ============================================================
   5) CONTROL PANEL
   ============================================================ */
#control {
  display: flex;
  flex: 0 0 280px;
  flex-flow: column;
  width: 280px;
  grid-row-gap: 10px;
  padding: 16px 18px 20px;
  background: var(--panel-bg);
  border-radius: 12px;
  border: 1px solid var(--panel-border);
  box-shadow: 0 18px 40px rgba(0,0,0,0.75);
}

.row { align-items: center; grid-column-gap: 10px; }

.input {
  flex: 1 0 auto;
  flex-flow: column;
  height: 36px;
  background: var(--input-bg);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  padding: 2px 6px;
}
.input span { font-size: 11px; color: var(--text-muted); }
.input input { background: transparent; border: none; color: var(--text-main); }

.icon-button {
  width: 36px;
  height: 36px;
  font-size: 24px;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  background: var(--icon-bg);
  border: 1px solid rgba(255,255,255,0.14);
  cursor: pointer;
}

/* ============================================================
   6) BUTTONS
   ============================================================ */
.button {
  flex: 1 0 auto;
  font-size: 14px;
  height: 36px;
  background: linear-gradient(135deg, var(--accent-main), var(--accent-secondary));
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  color: #1b1307;
  box-shadow: 0 6px 18px rgba(0,0,0,0.65);
}
.button-small {
  height: 28px;
  font-size: 12px;
  padding: 0 10px;
}

/* ============================================================
   7) PREVIEW + CANVAS
   ============================================================ */
#preview {
  flex: 1 1 auto;
  flex-flow: column;
  align-items: center;
  padding: 10px 0;
}

#canvas {
  border: 2px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  background: radial-gradient(
    circle at top,
    var(--canvas-top),
    var(--canvas-mid) 65%,
    var(--canvas-bottom)
  );
  box-shadow: 0 0 18px 2px var(--accent-glow);
}
#canvas.active { cursor: pointer; }

/* ============================================================
   8) GM BAR
   ============================================================ */
#gm-helper {
  margin-top: 8px;
  width: 100%;
  max-width: 600px;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-muted);
}

/* ============================================================
   9) THEME BUTTONS
   ============================================================ */
.theme-row { margin-top: 8px; justify-content: space-between; }
.theme-label { font-size: 11px; color: var(--text-muted); }
.theme-button {
  width: 30px; height: 20px;
  border-radius: 999px;
  border: 1px solid rgba(0,0,0,0.6);
  cursor: pointer;
}
.theme-button.gold { background: linear-gradient(135deg,#ffbf3c,#f06c1c); }
.theme-button.necro { background: linear-gradient(135deg,#38ff88,#14c76b); }
.theme-button.eldritch { background: linear-gradient(135deg,#c273ff,#7b3dff); }
.theme-button.blood { background: linear-gradient(135deg,#ff3b3b,#c21830); }

</style>
</head>

<body class="theme-gold">

<!-- ============================================================
     HEADER
     ============================================================ -->
<header id="app-header">
  <h1>CULT OF DIRTY RPG PRESENTS: <span>PICTURE PERFECT</span></h1>
  <p>Load an image, generate the grid, then reveal it one click at a time.</p>
</header>

<!-- ============================================================
     CONTROL PANEL
     ============================================================ -->
<div id="control">

  <div class="row">
    <label class="input">
      <span>URL to image</span>
      <input id="file_input" />
    </label>
    <label class="icon-button" id="file_button">
      <span style="transform: rotate(270deg)">➥</span>
      <input type="file" id="file_browse" class="hidden" />
    </label>
  </div>

  <div class="row">
    <label class="input"><span>Font size</span><input id="font-size" type="number" min="10" max="30" /></label>
  </div>

  <div class="row">
    <label class="input"><span>Width</span><input id="width" type="number" min="300" /></label>
  </div>

  <div class="row">
    <label class="input"><span>Height</span><input id="height" type="number" min="300" /></label>
  </div>

  <div class="row">
    <label class="input"><span>Columns</span><input id="column" type="number" min="1" /></label>
  </div>

  <div class="row">
    <label class="input"><span>Rows</span><input id="row" type="number" min="1" /></label>
  </div>

  <div class="row">
    <button class="button" id="generate" disabled>Generate Grid</button>
    <button class="button" id="start" disabled>Start</button>
    <button class="button hidden" id="stop">Stop</button>
  </div>

  <div class="row theme-row">
    <span class="theme-label">Theme</span>
    <div style="display:flex; gap:6px;">
      <button class="theme-button gold" data-theme="gold"></button>
      <button class="theme-button necro" data-theme="necro"></button>
      <button class="theme-button eldritch" data-theme="eldritch"></button>
      <button class="theme-button blood" data-theme="blood"></button>
    </div>
  </div>

</div>

<!-- ============================================================
     PREVIEW + CANVAS + GM BAR
     ============================================================ -->
<div id="preview">
  <canvas id="canvas" width="600" height="600" style="width:600px;height:600px;"></canvas>

  <div id="gm-helper">
    <span>CTRL+C: copy • CTRL+Z: undo • Theme buttons change colors</span>
    <button id="copy-btn" class="button button-small">Copy to Clipboard</button>
  </div>

  <i id="natural_dimension"></i>
</div>

<!-- ============================================================
     SCRIPT
     ============================================================ -->
<script>
const element_canvas = document.getElementById("canvas");
const element_file_button = document.getElementById("file_button");
const element_file_input = document.getElementById("file_input");
const element_file_browse = document.getElementById("file_browse");
const element_font_size = document.getElementById("font-size");
const element_width = document.getElementById("width");
const element_height = document.getElementById("height");
const element_row = document.getElementById("row");
const element_column = document.getElementById("column");
const element_generate = document.getElementById("generate");
const element_start = document.getElementById("start");
const element_stop = document.getElementById("stop");
const element_copy_btn = document.getElementById("copy-btn");
const ctx = element_canvas.getContext("2d");

const colors = [
  "#1abc9c","#2ecc71","#3498db","#9b59b6","#16a085","#27ae60","#2980b9",
  "#8e44ad","#f1c40f","#e67e22","#e74c3c","#30336b","#f39c12","#d35400",
  "#c0392b","#ffbe76","#f9ca24","#f0932b","#eb4d4b","#6ab04c","#7ed6df",
  "#22a6b3","#e056fd","#be2edd","#686de0","#4834d4","#badc58","#b33771",
  "#6d214f","#9aecdb","#bdc581","#fc427b"
];

let source = "";
let running = false;
let font_size = 16;
let width = 600;
let height = 600;
let natural_width = 0;
let natural_height = 0;
let quadrilateral_column = 4;
let quadrilateral_row = 4;
let quadrilateral_list = [];
let quadrilateral_picked = [];

document.addEventListener("DOMContentLoaded", () => {
  element_file_input.value = source;
  element_font_size.value = font_size;
  element_width.value = width;
  element_height.value = height;
  element_row.value = quadrilateral_row + 1;
  element_column.value = quadrilateral_column + 1;

  element_canvas.addEventListener("click", handleCanvasClick);
  element_file_input.addEventListener("change", handleFileInputChange);
  element_file_browse.addEventListener("change", handleFileBrowseChange);

  element_font_size.addEventListener("change", handleFontSizeChange);
  element_width.addEventListener("change", handleSizeChange);
  element_height.addEventListener("change", handleSizeChange);

  element_row.addEventListener("change", handleGridChange);
  element_column.addEventListener("change", handleGridChange);

  element_generate.addEventListener("click", handleGenerate);
  element_start.addEventListener("click", handleStart);
  element_stop.addEventListener("click", handleStop);

  window.addEventListener("keydown", handleKeyDown);

  document.querySelectorAll(".theme-button").forEach(btn => {
    btn.addEventListener("click", () => {
      setTheme(btn.dataset.theme);
    });
  });

  element_copy_btn.addEventListener("click", copyCanvasToClipboard);

  updateCanvasSize();
});

function setTheme(theme) {
  const body = document.body;
  ["gold","necro","eldritch","blood"].forEach(t => body.classList.remove("theme-"+t));
  body.classList.add("theme-"+theme);
}

function copyCanvasToClipboard() {
  if (!source) return;
  element_canvas.toBlob(blob => {
    navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
  });
}

function handleKeyDown(event) {
  let code = event.code;
  if (event.ctrlKey && event.code !== "ControlLeft" && event.code !== "ControlRight")
    code = "CTRL+" + code;

  if (code === "CTRL+KeyC") {
    event.preventDefault();
    copyCanvasToClipboard();
  }

  if (code === "CTRL+KeyZ") {
    const index = quadrilateral_picked.pop();
    const quad = quadrilateral_list.at(index);
    if (quad) {
      quad.checked = false;
      drawQuadrilateralGrid();
    }
  }
}

function handleCanvasClick(event) {
  if (!running) return;
  const rect = event.target.getBoundingClientRect();
  const x = event.pageX - rect.x - event.target.clientLeft;
  const y = event.pageY - rect.y - event.target.clientTop;

  for (let i = 0; i < quadrilateral_list.length; i++) {
    const quad = quadrilateral_list.at(i);
    if (!quad || quad.checked || !inQuadrilateral({x,y}, quad)) continue;

    quad.checked = true;
    quadrilateral_picked.push(i);
    drawImage().then(drawQuadrilateralGrid);
    return;
  }
}

function handleFontSizeChange() {
  font_size = element_font_size.value;
  if (quadrilateral_list.length) handleGenerate();
}

function handleFileInputChange(e) {
  source = e.target.value;
  drawImage();
  element_start.disabled = true;
  element_generate.disabled = false;
}

function handleFileBrowseChange(e) {
  const file = e.target.files[0];
  if (!file || file.type.split("/")[0] !== "image") return;

  const reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onloadend = () => {
    source = reader.result.toString();
    element_file_browse.value = "";
    drawImage();
    element_start.disabled = true;
    element_generate.disabled = false;
  };
}

function drawImage() {
  const image = new Image();
  image.src = source;
  return new Promise((resolve, reject) => {
    image.onload = () => {
      natural_width = image.width;
      natural_height = image.height;
      document.getElementById("natural_dimension").innerText =
        `Natural dimension: ${natural_width}x${natural_height}`;
      ctx.drawImage(image, 0, 0, width, height);
      resolve();
    };
    image.onerror = reject;
  });
}

function handleSizeChange() {
  width = +element_width.value;
  height = +element_height.value;
  element_canvas.width = width;
  element_canvas.height = height;
  element_canvas.style.width = `${width}px`;
  element_canvas.style.height = `${height}px`;
}

function handleGridChange() {
  quadrilateral_column = +element_column.value - 1;
  quadrilateral_row = +element_row.value - 1;
  if (quadrilateral_list.length) handleGenerate();
}

function handleGenerate() {
  shuffle(colors);
  generateQuadrilateralList();
  drawQuadrilateralGrid();
  element_start.disabled = false;
}

function handleStart() {
  running = true;
  element_canvas.classList.add("active");
  disableControls(true);
  element_start.classList.add("hidden");
  element_stop.classList.remove("hidden");
}

function handleStop() {
  running = false;
  element_canvas.classList.remove("active");
  disableControls(false);
  element_stop.classList.add("hidden");
  element_start.classList.remove("hidden");
  drawImage();
}

function disableControls(disabled) {
  const controls = [
    element_file_input, element_file_button, element_file_browse,
    element_font_size, element_width, element_height,
    element_row, element_column, element_generate
  ];
  controls.forEach(c => {
    if (disabled) c.setAttribute("disabled","");
    else c.removeAttribute("disabled");
  });
}

function generateQuadrilateralList() {
  quadrilateral_list.length = 0;
  quadrilateral_picked.length = 0;

  const width_fraction = width / (quadrilateral_column + 1);
  const height_fraction = height / (quadrilateral_row + 1);
  const vertical = [];
  const horizontal = [];

  vertical.push({ x1:0,y1:0,x2:0,y2:height,formula:getLine(0,0,0,height) });
  horizontal.push({ x1:0,y1:0,x2:width,y2:0,formula:getLine(0,width,0,0) });

  for (let i=0; i<quadrilateral_column; i++) {
    const x = getLinePoint(width_fraction, i);
    vertical.push({ x1:x,y1:0,x2:x,y2:height,formula:getLine(x,x,0,height)});
  }

  for (let i=0; i<quadrilateral_row; i++) {
    const y = getLinePoint(height_fraction, i);
    horizontal.push({ x1:0,y1:y,x2:width,y2:y,formula:getLine(0,width,y,y)});
  }

  vertical.push({ x1:width,y1:0,x2:width,y2:height, formula:getLine(width,width,0,height) });
  horizontal.push({ x1:0,y1:height,x2:width,y2:height, formula:getLine(0,width,height,height) });

  for (let j=0; j<horizontal.length-1; j++) {
    for (let i=0; i<vertical.length-1; i++) {
      const quad = generateQuadrilateral(
        vertical[i].formula,
        vertical[i+1].formula,
        horizontal[j].formula,
        horizontal[j+1].formula
      );
      quadrilateral_list.push(quad);
    }
  }
}

function generateQuadrilateral(lv1, lv2, lh1, lh2) {
  const top_left = getIntersection(lh1, lv1);
  const top_right = getIntersection(lh1, lv2);
  const bottom_left = getIntersection(lh2, lv1);
  const bottom_right = getIntersection(lh2, lv2);

  const mid_top_x = (top_right.x + top_left.x)/2;
  const mid_top_y = -(lh1.a*mid_top_x + lh1.c)/lh1.b;
  const mid_bottom_x = (bottom_right.x + bottom_left.x)/2;
  const mid_bottom_y = -(lh2.a*mid_top_x + lh2.c)/lh2.b;
  const x_line = getLine(mid_top_x, mid_bottom_x, mid_top_y, mid_bottom_y);

  const mid_left_y = (top_left.y + bottom_left.y)/2;
  const mid_left_x = -(lv1.b*mid_left_y + lv1.c)/lv1.a;
  const mid_right_y = (top_right.y + bottom_right.y)/2;
  const mid_right_x = -(lv2.b*mid_right_y + lv2.c)/lv2.a;
  const y_line = getLine(mid_left_x, mid_right_x, mid_left_y, mid_right_y);
  const center = getIntersection(x_line, y_line);

  return { top_left, top_right, bottom_left, bottom_right, center, checked:false };
}

function drawQuadrilateralGrid() {
  let counter = 1;
  for (let i=0; i<quadrilateral_list.length; i++) {
    const q = quadrilateral_list.at(i);
    if (q.checked) continue;

    const {top_left, top_right, bottom_left, bottom_right, center} = q;

    ctx.beginPath();
    ctx.moveTo(top_left.x, top_left.y);
    ctx.lineTo(top_right.x, top_right.y);
    ctx.lineTo(bottom_right.x, bottom_right.y);
    ctx.lineTo(bottom_left.x, bottom_left.y);
    ctx.closePath();

    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();

    ctx.font = `${font_size}px Arial`;
    ctx.textBaseline = "middle";
    ctx.textAlign = "center";
    ctx.fillStyle = "black";  // stays black per your request
    ctx.fillText(String(counter++), center.x, center.y);
  }
}

function updateCanvasSize() {
  element_canvas.width = width;
  element_canvas.height = height;
  element_canvas.style.width = `${width}px`;
  element_canvas.style.height = `${height}px`;
}

function inQuadrilateral(point, q) {
  const {top_left, top_right, bottom_left, bottom_right} = q;
  const diag = getLength(bottom_right, top_left);
  const top_len = getLength(top_right, top_left);
  const left_len = getLength(bottom_left, top_left);
  const right_len = getLength(bottom_right, top_right);
  const bottom_len = getLength(bottom_right, bottom_left);

  const t1 = getTriangleHeight(bottom_len, diag, left_len);
  const t2 = getTriangleHeight(top_len, diag, right_len);
  const area = 0.5 * diag * (t1 + t2);

  const A1 = getTriangleArea(point, top_left, top_right);
  const A2 = getTriangleArea(point, top_right, bottom_right);
  const A3 = getTriangleArea(point, bottom_right, bottom_left);
  const A4 = getTriangleArea(point, bottom_left, top_left);

  return Math.round(area) === Math.round(A1+A2+A3+A4);
}

function getTriangleArea(p1, p2, p3) {
  const a = getLength(p1, p2);
  const b = getLength(p1, p3);
  const c = getLength(p2, p3);
  const s = (a+b+c)/2;
  return Math.sqrt(s*(s-a)*(s-b)*(s-c));
}

function getLength(p1, p2) {
  return Math.sqrt((p2.x-p1.x)**2 + (p2.y-p1.y)**2);
}

function getTriangleHeight(a,b,c) {
  const p1 = a+b+c;
  const p2 = -a+b+c;
  const p3 = a-b+c;
  const p4 = a+b-c;
  return (0.5*Math.sqrt(p1*p2*p3*p4))/b;
}

function getLinePoint(frac, i) {
  return Math.floor(Math.random()*frac+1) + (i+0.5)*frac;
}

function getLine(x1,x2,y1,y2) {
  const a = y1 - y2;
  const b = x2 - x1;
  const c = x1*y2 - x2*y1;
  return {a,b,c};
}

function getIntersection(l1,l2) {
  const d = l1.a*l2.b - l2.a*l1.b;
  return {
    x : -((l2.b*l1.c - l1.b*l2.c)/d),
    y : -((l1.a*l2.c - l2.a*l1.c)/d)
  };
}

function shuffle(arr) {
  let i = arr.length;
  while (i > 0) {
    const r = Math.floor(Math.random()*i--);
    [arr[i], arr[r]] = [arr[r], arr[i]];
  }
  return arr;
}
